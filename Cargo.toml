[package]
name = "carpentry"
version = "0.1.0"
edition = "2021"
default-run = "carpentry"

# Exactly what was chosen when this application was scaffolded.
#
# The core is a router handing a request and a context to a handler, and it
# depends on none of the rest. A capability that is not listed below is not
# compiled, not linked, and contributes nothing: no section in the config, no
# field on the context, no bytes in the binary.
#
# Not here, because nothing asked for it:
#   brocanth-model     no ORM, no SQL driver, no sea-orm anywhere in the lock file
#   brocanth-cache     no cache; every read does the work a hit would have skipped
#   brocanth-realtime  no broker; a write tells nobody, and a client finds out by asking again
[dependencies]
brocanth = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth" }
brocanth-config = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth-config" }
brocanth-command = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth-command" }
rsx = { git = "https://github.com/DHHwasRight/rsx.git", branch = "main" }  # templates, compiled
brocanth-pages = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth-pages" }
brocanth-assets = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth-assets" }
brocanth-server = { path = "/Users/max/Documents/Dev/rust/brocanth/crates/brocanth-server" }
tokio = { version = "1", features = ["rt-multi-thread"] }  # the reactor `serve` runs on
serde = { version = "1", features = ["derive"] }  # the config plugin reads typed sections
serde_json = "1.0.154"
